name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm run release:check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: auto-scheduler-node-${{ matrix.node }}
          path: dist/auto-scheduler/
